name: ci

on:
  push:
  pull_request:
  # The eval suites run only when asked (below): they spend model quota, not CI minutes.
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m pytest backend/tests/unit -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npm run lint && npm test && npm run build
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: python -m scout.contract.export | diff - contract/v1.schema.json
  evals:
    # Manual only. Job 1 runs on Gemini's free tier — 15 requests a minute and 500 a day
    # for the whole project — and one pass is 146 of them. On every push this job would
    # have spent 438 a day and, with three matrix runs in parallel, three separate
    # per-process pacers would have shared one 15-a-minute window and burned it on 429s.
    # Runs one at a time; `gh workflow run ci.yml` starts the three sign-off passes.
    if: github.event_name == 'workflow_dispatch'
    needs: [backend-unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [1, 2, 3]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LATENCY_LOG_PATH: latency/evals-run${{ matrix.run }}.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: python -m pytest evals -q
      # Prints this run's latency table. It never fails the job on its own: these rows are
      # server traces (per-component timings that start after the ack), not the end-to-end
      # L0–L8 client rows the targets are defined on, and spec §5.2 scores p99 over every
      # suite run plus the 20 timed interactions together. Sign-off (Task 4.1 Step 4,
      # Docs/LATENCY_REPORT.md) reads the merged report, not one run's exit code.
      - name: latency table
        shell: bash
        run: |
          shopt -s nullglob
          files=(latency/evals-run*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no latency/evals-run*.jsonl was written by this run"
          else
            python -m evals.latency.score --table "${files[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: latency-run${{ matrix.run }}
          path: latency/
