[project]
name = "scout"
version = "0.1.0"
description = "Voice-based AI property scout — Bengaluru (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "websockets==17.1",
    "httpx==0.28.1",
    "anthropic==1.3.0",
    "groq==1.7.0",
    "deepgram-sdk==7.8.0",
    "smallestai==5.12.0",
    "chromadb==1.5.9",
    "onnxruntime==1.29.0",
    "google-api-python-client==2.200.0",
    "google-auth==2.57.0",
    "google-auth-oauthlib==1.4.1",
    "reportlab==5.0.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "openpyxl==3.1.5",
    "mcp==2.1.1",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.5", "respx==0.23.1", "freezegun==1.5.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["scout*"]
